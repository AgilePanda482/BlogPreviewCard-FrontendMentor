<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">  
    <link rel="stylesheet" href="./dist/output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <title>Frontend Mentor | Blog preview card</title>
  </head>
  <body class="min-h-dvh font-figtree bg-yellow-card flex flex-col items-center gap-2">
    <main class="flex-1 flex justify-center items-center">
      <div class="bg-white max-w-xs md:max-w-sm p-6 rounded-2xl border-1 shadow-(--shadow-flat) flex flex-col gap-6">
        <img class="rounded-xl" src="./assets/images/illustration-article.svg" alt="Web Development Image">

        <section class="flex flex-col gap-4">
          <div class="flex flex-col items-center bg-yellow-card p-1 max-w-24 font-bold rounded-sm">
            <p>Learning</p>
          </div> 
          <p class="">Published 21 Dec 2023</p>
          
          <h1 class="font-extrabold text-2xl hover:text-yellow-card hover:cursor-pointer">HTML & CSS foundations</h1>
          <p class="text-gray-500-card text-md">
            These languages are the backbone of every website, defining structure, content, and presentation.
          </p>
        </section>

        <section class="flex items-center gap-2">
          <img class="max-w-10" src="./assets/images/image-avatar.webp" alt="profile photo">
          <p class="font-extrabold text-lg">Greg Hooper</p>
        </section>
      </div>
    </main>
    <footer class="flex flex-col justify-center md:flex-row md:gap-2 font-bold">
      <p class="text-center">
        Challenge by <a class="hover:underline hover:text-white" href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener noreferrer">Frontend Mentor.</a>
      </p>
      <p class="text-center">
        Coded by <a class="hover:underline hover:text-white" href="https://www.github.com/agilepanda482" target="_blank" rel="noopener noreferrer">Sebastian Rico Vela.</a>
      </p>
    </footer>
  </body>
</html>
